{{- if .Values.database.externalSecret.enabled }}
# Pulls the RDS-managed credentials from AWS Secrets Manager (External Secrets Operator).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.database.externalSecret.region }}   # credentials come from the node IAM role
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.secretName }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: {{ .Values.database.secretName }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.database.externalSecret.awsSecretArn | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.database.externalSecret.awsSecretArn | quote }}
        property: password
{{- end }}
